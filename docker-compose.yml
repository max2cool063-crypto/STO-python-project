services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build: .
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: ${ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    command: ["gunicorn", "auto_booking.wsgi:application", "--config", "gunicorn.conf.py"]
    volumes:
      - media_data:/app/media
    # Keep Gunicorn reachable only from the deployment host by default. A host
    # reverse proxy can forward HTTPS traffic to 127.0.0.1:8000 without exposing
    # the trusted-proxy backend directly to the network.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ${ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://redis:6379/1
    healthcheck:
      # Connect over the container's internal HTTP socket, but send an allowed
      # Host header. Production ALLOWED_HOSTS intentionally does not need to
      # include 127.0.0.1 merely to satisfy an internal liveness probe.
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; host=((os.getenv('ALLOWED_HOSTS') or 'localhost').split(',')[0].strip() or 'localhost'); request=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': host}); urllib.request.urlopen(request, timeout=5)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    build: .
    restart: unless-stopped
    command: >
      sh -c "
        set -e;
        echo 'Cron started';
        while true; do
          python manage.py update_appointments;
          python manage.py send_reminders;
          sleep 900;
        done
      "
    env_file: ${ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
