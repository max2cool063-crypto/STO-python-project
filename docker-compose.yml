services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "
      until pg_isready -h db -p 5432;
      do echo 'Waiting for database...';
      sleep 2;
      done;
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn auto_booking.wsgi:application --config gunicorn.conf.py"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  # cron-контейнер: обновление статусов + напоминания клиентам
  cron:
    build: .
    restart: unless-stopped
    command: >
      sh -c "while true; do
        python manage.py update_appointments;
        python manage.py send_reminders;
        sleep 900;
      done"
    env_file: .env
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
