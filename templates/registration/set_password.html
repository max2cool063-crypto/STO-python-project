{% extends "base.html" %}

{% block title %}Установка пароля{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-card__head">
      <span class="auth-eyebrow">Безопасность</span>
      <h1>Установите пароль</h1>
      <p>Придумайте пароль для входа в сервис технического осмотра.</p>
    </div>

    <form method="post" class="auth-form">
      {% csrf_token %}
      <label for="password">Новый пароль</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

      <label for="confirmation">Повторите пароль</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" required>

      <button type="submit" class="btn btn-primary">Установить пароль</button>
    </form>
  </div>
</div>
{% endblock %}
