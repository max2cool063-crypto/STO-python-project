{% for message in messages %}
  <div class="password-feedback{% if message.level == 40 %} password-feedback--error{% endif %}"{% if message.level == 40 %} role="alert" tabindex="-1" data-password-error{% endif %}>{{ message }}</div>
{% endfor %}
<p class="password-requirements">Пароль должен содержать не менее 8 символов. Не используйте распространённый пароль, только цифры или пароль, похожий на ваши личные данные.</p>
