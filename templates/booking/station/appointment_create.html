{% extends "booking/station/base.html" %}
{% block station_content %}
<h2>Создать запись — {{ station.name }}</h2>

<div class="st-card" style="max-width:600px">
  <div class="st-card__body">
    <form method="post" id="appt-form">
      {% csrf_token %}
      <input type="hidden" name="car_id" id="car-id-input" value="">

      <!-- Поиск авто -->
      <div class="st-form-group" style="margin-bottom:20px">
        <label>Госномер автомобиля *</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" name="plate" id="plate-input" class="st-input"
                 style="text-transform:uppercase;width:180px"
                 oninput="this.value=this.value.toUpperCase()"
                 placeholder="А123БВ77" required>
          <button type="button" class="st-btn st-btn--secondary" onclick="lookupCar()">Найти в системе</button>
        </div>
        <div id="car-info" style="margin-top:8px;font-size:13px"></div>
      </div>

      <!-- Блок нового авто -->
      <div id="new-car-block" style="display:none;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:20px">
        <div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:12px">
          Автомобиль не найден — заполните данные для регистрации
        </div>
        <div class="st-form-group" style="margin-bottom:12px">
          <label>Email клиента *</label>
          <input type="email" name="new_user_email" id="new-email" class="st-input" placeholder="client@example.com">
          <div style="font-size:12px;color:#6b7280;margin-top:3px">Клиенту придёт письмо с доступом в личный кабинет</div>
        </div>
        <div class="st-form-row">
          <div class="st-form-group">
            <label>Марка *</label>
            <select id="brand-select" class="st-select" style="min-width:160px" onchange="updateModels()">
              <option value="">— выберите —</option>
            </select>
          </div>
          <div class="st-form-group">
            <label>Модель *</label>
            <select name="new_model_id" id="model-select" class="st-select" style="min-width:180px">
              <option value="">— сначала марку —</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Данные клиента -->
      <div class="st-form-group" style="margin-bottom:14px">
        <label>Имя клиента *</label>
        <input type="text" name="client_name" id="client-name" class="st-input" required placeholder="Иванов Иван Иванович">
      </div>
      <div class="st-form-group" style="margin-bottom:20px">
        <label>Телефон клиента</label>
        <input type="text" name="client_phone" id="client-phone" class="st-input" placeholder="+7 900 000 00 00">
      </div>

      <!-- Дата — нативный date picker -->
      <div class="st-form-group" style="margin-bottom:14px">
        <label>Дата *</label>
        <input type="date" id="date-input" class="st-input" style="width:200px"
               min="{{ today }}" onchange="loadSlots(this.value)" required>
      </div>

      <!-- Слоты -->
      <div class="st-form-group" style="margin-bottom:24px">
        <label>Время (свободные слоты) *</label>
        <select name="start" id="slots-select" class="st-select" required style="width:220px">
          <option value="">— сначала выберите дату —</option>
        </select>
        <div id="slots-hint" style="font-size:12px;color:#6b7280;margin-top:4px"></div>
      </div>

      <div style="display:flex;gap:10px">
        <button type="submit" class="st-btn st-btn--primary">Создать запись</button>
        <a href="{% url 'station_appointments' station.pk %}" class="st-btn st-btn--secondary">Отмена</a>
      </div>
    </form>
  </div>
</div>

<script>
const STATION_ID = {{ station.pk }};
let currentCarId = null;
let allBrands = [];

// Загрузка марок при старте страницы
async function loadBrands() {
  try {
    const resp = await fetch('/api/brands-with-models/');
    if (!resp.ok) return;
    allBrands = await resp.json();
    const sel = document.getElementById('brand-select');
    allBrands.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.name;
      sel.appendChild(opt);
    });
  } catch(e) {
    console.error('Ошибка загрузки марок:', e);
  }
}
loadBrands();

function updateModels() {
  const brandId = parseInt(document.getElementById('brand-select').value);
  const sel = document.getElementById('model-select');
  sel.innerHTML = '<option value="">— выберите —</option>';
  const brand = allBrands.find(b => b.id === brandId);
  if (!brand) return;
  brand.models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.name + (m.vehicle_type === 'TRUCK' ? ' (грузовой)' : '');
    sel.appendChild(opt);
  });
}

async function lookupCar() {
  const plate = document.getElementById('plate-input').value.trim();
  const info  = document.getElementById('car-info');
  const newBlock = document.getElementById('new-car-block');
  if (!plate) { info.textContent = 'Введите госномер'; info.style.color = '#dc2626'; return; }

  info.style.color = '#6b7280';
  info.textContent = 'Поиск...';

  try {
    const resp = await fetch('/api/car-by-plate/?plate=' + encodeURIComponent(plate));
    if (resp.status === 404) throw new Error('not_found');
    if (!resp.ok) throw new Error('error');
    const data = await resp.json();

    currentCarId = data.id;
    document.getElementById('car-id-input').value = data.id;
    newBlock.style.display = 'none';
    info.style.color = '#15803d';
    info.textContent = '✓ ' + data.brand + ' ' + data.model + ' — ' + data.owner_name;

    if (!document.getElementById('client-name').value)
      document.getElementById('client-name').value = data.owner_name || '';
    if (!document.getElementById('client-phone').value)
      document.getElementById('client-phone').value = data.owner_phone || '';

    const date = document.getElementById('date-input').value;
    if (date) loadSlots(date);

  } catch(e) {
    currentCarId = null;
    document.getElementById('car-id-input').value = '';
    newBlock.style.display = 'block';
    info.style.color = '#d97706';
    info.textContent = '⚠ Автомобиль не найден — заполните данные ниже для регистрации нового';
  }
}

async function loadSlots(date) {
  const select = document.getElementById('slots-select');
  const hint   = document.getElementById('slots-hint');
  if (!date) return;
  select.innerHTML = '<option value="">Загрузка...</option>';
  hint.textContent = '';

  let url = '/api/station/' + STATION_ID + '/slots/?date=' + date;
  if (currentCarId) url += '&car=' + currentCarId;

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    select.innerHTML = '';
    if (!data.slots || data.slots.length === 0) {
      select.innerHTML = '<option value="">Нет свободных слотов</option>';
      hint.textContent = 'Нет свободных слотов на эту дату';
      hint.style.color = '#dc2626';
      return;
    }
    hint.style.color = '#6b7280';
    data.slots.forEach(slot => {
      // Берём время напрямую из строки ISO без конвертации timezone браузером
      // slot.start вида "2026-03-31T12:00:00+03:00"
      const timeStart = slot.start.substring(11, 16);
      const timeEnd   = slot.end.substring(11, 16);
      const opt = document.createElement('option');
      opt.value = slot.start;
      opt.textContent = timeStart + ' — ' + timeEnd;
      select.appendChild(opt);
    });
    hint.textContent = 'Найдено слотов: ' + data.slots.length;
  } catch {
    select.innerHTML = '<option value="">Ошибка загрузки слотов</option>';
  }
}

document.getElementById('appt-form').addEventListener('submit', function(e) {
  const carId    = document.getElementById('car-id-input').value;
  const newBlock = document.getElementById('new-car-block');

  if (!carId && newBlock.style.display !== 'none') {
    const email   = document.getElementById('new-email').value.trim();
    const modelId = document.getElementById('model-select').value;
    if (!email) {
      e.preventDefault();
      alert('Укажите email клиента');
      return;
    }
    if (!modelId) {
      e.preventDefault();
      alert('Выберите марку и модель автомобиля');
      return;
    }
  } else if (!carId) {
    e.preventDefault();
    const info = document.getElementById('car-info');
    info.style.color = '#dc2626';
    info.textContent = '✗ Сначала найдите автомобиль по госномеру или заполните данные нового';
    document.getElementById('plate-input').focus();
  }
});
</script>
{% endblock %}
