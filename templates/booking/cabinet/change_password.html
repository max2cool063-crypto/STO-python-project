{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div style="max-width:440px;margin:40px auto;padding:0 16px">
  <h2 style="margin-bottom:24px">Смена пароля</h2>
  <div class="card card-accent">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Текущий пароль</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Новый пароль</label>
        <input type="password" name="new_password" class="form-control" required minlength="8">
        <small style="color:#6b7280">Минимум 8 символов</small>
      </div>
      <div class="form-group">
        <label>Подтвердите новый пароль</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button type="submit" class="btn btn-primary">Сменить пароль</button>
        <a href="{% url 'cabinet' %}" class="btn" style="background:#f3f4f6;color:#374151">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
